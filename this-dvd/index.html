// the logo in one colour: alpha of logo.png times the tint
const tinted = document.createElement('canvas'), tg = tinted.getContext('2d');
let tintFor = -1;
function tint(bounces) {
  if (bounces === tintFor) return;
  tintFor = bounces;
  tinted.width = img.width; tinted.height = img.height;
  tg.drawImage(img, 0, 0);
  tg.globalCompositeOperation = 'source-in';
  // golden-ratio hue steps: every bounce looks clearly different from the last
  tg.fillStyle = `hsl(${(bounces * 0.618034 % 1) * 360} 100% 62%)`;
  tg.fillRect(0, 0, img.width, img.height);
  tg.globalCompositeOperation = 'source-over';
}

// triangle wave 0..r..0: travel straight, reflect off each wall
const tri = (p, r) => { const m = p % (2 * r); return m < r ? m : 2 * r - m; };
const rand = (a, b) => a + Math.random() * (b - a);

// random start, so every load starts somewhere else
const x0 = Math.random() * 10000, y0 = Math.random() * 10000;
let W, H, k, lastWall = null, lastParty = -10;
const confetti = [];
const SLACK = 10;   // corner = bouncing off one wall while within this many px of the other

function resize() {
  W = cv.width = Math.round(innerWidth * devicePixelRatio);
  H = cv.height = Math.round(innerHeight * devicePixelRatio);
  k = H / 1080;
}
addEventListener('resize', resize);
resize();

function party(left, top) {
  // aim into the screen, away from the corner (0 = right, 90 = down)
  const aim = top ? (left ? 45 : 135) : (left ? -45 : -135);
  for (let i = 0; i < 300; i++) {
    const a = (aim + rand(-35, 35)) * Math.PI / 180, v = rand(200, 800) * k, s = rand(8, 20) * k;
    confetti.push({ x: left ? 0 : W, y: top ? 0 : H, vx: v * Math.cos(a), vy: v * Math.sin(a), w: s * 8 / 14, h: s,
      rot: rand(-180, 180), spin: rand(-360, 360), hue: rand(0, 360), age: 0 });
  }
}

let start = null, prev = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!img.complete) return;
  if (start === null) start = now;
  const t = (now - start) / 1000, dt = Math.min(t - prev, 0.1);
  prev = t;

  const lw = W * SIZE / 100, lh = lw * img.height / img.width;
  const rx = Math.max(W - lw, 1), ry = Math.max(H - lh, 1);
  const px = x0 + SPEED * 30 * k * t, py = y0 + SPEED * 30 * 0.8 * k * t;
  const wx = Math.floor(px / rx), wy = Math.floor(py / ry);
  // every wall crossed is one more bounce
  tint(wx + wy);

  const wall = wx + ',' + wy, near = (p, r) => { const v = tri(p, r); return v < SLACK * k || v > r - SLACK * k; };
  // t < 1: skip wall changes caused by startup/resize
  if (lastWall !== null && wall !== lastWall && t >= 1 && t - lastParty >= 1 && near(px, rx) && near(py, ry)) {
    lastParty = t;
    party(tri(px, rx) < rx / 2, tri(py, ry) < ry / 2);
  }
  lastWall = wall;

  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  g.imageSmoothingQuality = 'high';
  g.drawImage(tinted, tri(px, rx), tri(py, ry), lw, lh);

  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.age += dt;
    if (c.age > 6) { confetti.splice(i, 1); continue; }
    c.vy += 150 * k * dt;
    // sideways flutter while falling
    c.wob = Math.max(-120 * k, Math.min(120 * k, (c.wob || 0) + rand(-1000, 1000) * k * dt));
    c.x += (c.vx + c.wob) * dt; c.y += c.vy * dt; c.rot += c.spin * dt;
    g.save();
    g.translate(c.x, c.y);
    g.rotate(c.rot * Math.PI / 180);
    g.fillStyle = `hsl(${c.hue} 90% 60%)`;
    g.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    g.restore();
  }
}
requestAnimationFrame(frame);
