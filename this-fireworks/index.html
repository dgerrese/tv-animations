<script>
// Rockets that burst into th[is] logos, every stage of a shell in its own hue,
// some with crossette comets or a second inner burst. Port of the KDE wallpaper local.thisfireworks.
// Knobs (URL params), e.g. index.html?rate=60&sparks=80
const q = new URLSearchParams(location.search);
const SCALE = +q.get('scale') || 1;   // render resolution; 0.5 = a quarter of the pixels, much lighter
const num = (name, def) => q.has(name) ? +q.get(name) : def;
const RATE = Math.max(num('rate', 30), 1);       // rockets per minute
const SPARKS = num('sparks', 60);                // logos per burst
const SIZE = num('size', 2);                     // logo width, % of screen width
const CROSSETTE = num('crossette', 20);          // % of shells whose comets burst again
const DOUBLE = num('double', 20);                // % of shells with a second, inner burst

// one 256 px sprite per hue: the logo with its left leg in hue i, centred in a square
const LH = 138.564, faces = ['left', 'bottom', 'top'].map(id => new Path2D(document.getElementById(id).getAttribute('d')));
const sprites = Array.from({ length: 12 }, (_, i) => {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = c.height = 256;
  g.scale(256 / LH, 256 / LH);
  g.translate((LH - 120) / 2, LH);
  // the logo's top colour #303237 is lifted to read on dark
  [`hsl(${29 + 30 * i} 92% 52%)`, '#bdbcbc', '#6b6e75'].forEach((col, k) => { g.fillStyle = col; g.fill(faces[k], 'evenodd'); });
  return c;
});
// the rockets' glitter trail: a soft warm dot
const glow = document.createElement('canvas');
glow.width = glow.height = 32;
{
  const g = glow.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,240,215,1)'); gr.addColorStop(0.3, 'rgba(255,217,160,0.6)'); gr.addColorStop(1, 'rgba(255,217,160,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
}

const rand = (a, b) => a + Math.random() * (b - a);
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, sparkPx;
function resize() {
  W = cv.width = Math.round(innerWidth * devicePixelRatio * SCALE);
  H = cv.height = Math.round(innerHeight * devicePixelRatio * SCALE);
  sparkPx = Math.max(W * SIZE / 100, 4);
}
addEventListener('resize', resize);
resize();

const sparks = [], rockets = [], timers = [];
let t = 0;
const later = (s, fn) => timers.push({ at: t + s, fn });

// sparks shoot out fast and slow down (friction), and fall (gravity); fade in and out
function burst(hue, x, y, n, small) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 2 * Math.PI), v = small ? H * rand(0.07, 0.15) : H * rand(0.14, 0.4);
    const s = small ? sparkPx * rand(0.5, 0.9) : sparkPx * rand(0.7, 1.3);
    sparks.push({ x, y, vx: v * Math.cos(a), vy: v * Math.sin(a), s, age: 0, life: small ? rand(1.3, 1.9) : rand(1.8, 2.6),
      rot: rand(-180, 180), spin: rand(-90, 90), sprite: sprites[hue] });
  }
}
// trail glitter is a spark too, without a sprite
function glitter(x, y) {
  const a = (90 + rand(-25, 25)) * Math.PI / 180, v = rand(10, 70) * devicePixelRatio * SCALE;
  sparks.push({ x, y, vx: v * Math.cos(a), vy: v * Math.sin(a), s: rand(4, 8) * devicePixelRatio * SCALE, age: 0, life: rand(0.3, 0.7), rot: 0, spin: 0 });
}
// flies from (x0, y0) to (x1, y1), fast off the ground and slowing towards the top, then calls then(x, y)
const fly = (x0, y0, x1, y1, dur, then) => rockets.push({ x0, y0, x1, y1, dur, age: 0, debt: 0, then });

const hueOtherThan = h => (h + 1 + Math.floor(Math.random() * 11)) % 12;
function shell(x, y) {
  const a = Math.floor(Math.random() * 12), b = hueOtherThan(a), r = Math.random() * 100;
  burst(a, x, y, SPARKS, false);
  if (r < CROSSETTE) {
    // six comets fly out and each bursts small in the second colour
    for (let i = 0; i < 6; i++) {
      const angle = (i + 0.5 * Math.random()) * Math.PI / 3, reach = H * rand(0.15, 0.2);
      fly(x, y, x + reach * Math.cos(angle), y + reach * Math.sin(angle), 0.8, (cx, cy) => burst(b, cx, cy, 20, true));
    }
  } else if (r < CROSSETTE + DOUBLE) {
    // a second, inner ring at the same spot
    later(0.6, () => burst(b, x, y, SPARKS, true));
  }
}
function launch() {
  const x0 = W * rand(0.1, 0.9);
  fly(x0, H, x0 + W * 0.05 * rand(-0.5, 0.5), H * rand(0.15, 0.45), rand(1.4, 2), shell);
  // on average RATE per minute
  later(60 / RATE * rand(0.5, 1.5), launch);
}
// first rocket soon after start
later(0.3, launch);

let prev = null;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = prev === null ? 0 : Math.min((now - prev) / 1000, 0.1);
  prev = now;
  t += dt;

  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= t) timers.splice(i, 1)[0].fn();

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.age += dt;
    const p = Math.min(r.age / r.dur, 1), e = p * (2 - p);   // OutQuad
    const x = r.x0 + (r.x1 - r.x0) * e, y = r.y0 + (r.y1 - r.y0) * e;
    for (r.debt += 90 * dt; r.debt >= 1; r.debt--) glitter(x, y);
    if (p >= 1) { rockets.splice(i, 1); r.then(x, y); }
  }

  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  const drag = Math.exp(-1.2 * dt), gravity = H * 0.15;
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.age += dt;
    if (s.age > s.life) { sparks.splice(i, 1); continue; }
    s.vx *= drag; s.vy = s.vy * drag + gravity * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.spin * dt;
    const f = s.age / s.life;
    g.globalAlpha = Math.min(1, f * 10) * (1 - Math.max(0, Math.min(1, (f - 0.75) * 4)));
    if (s.sprite) {
      g.save();
      g.translate(s.x, s.y);
      g.rotate(s.rot * Math.PI / 180);
      g.drawImage(s.sprite, -s.s / 2, -s.s / 2, s.s, s.s);
      g.restore();
    } else {
      g.globalCompositeOperation = 'lighter';
      g.drawImage(glow, s.x - s.s / 2, s.y - s.s / 2, s.s, s.s);
      g.globalCompositeOperation = 'source-over';
    }
  }
  g.globalAlpha = 1;
}
requestAnimationFrame(frame);
</script>
