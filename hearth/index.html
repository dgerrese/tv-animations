<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>th[is] hearth</title>
<style>

  canvas { display: block; width: 100vw; height: 100vh; }
  svg { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -138.564 120 138.564" width="120" height="138.564">
<title>th[is] logo</title>
<path id="left" fill="#f58113" fill-rule="evenodd" d="M 10.1,-132.733 L 0,-138.564 L 0,-127.017 L 0.0999908,-126.959 z M 10.1,-51.9038 L 10,-51.9615 L 10,-98.1495 L 10.1,-98.0918 L 10.1,-109.639 L 10,-109.697 L 20,-115.47 L 20.1,-115.412 L 30.1,-121.186 L 19.9,-127.075 L 9.89999,-121.301 L 10,-121.244 L 0,-115.47 L 0,-57.6195 L 10.1,-51.7883 z M 30.1,-51.9038 L 30.1,-52.0193 L 30,-51.9615 L 30,-86.6025 L 30.1,-86.5448 L 30.1,-98.0918 L 30,-98.1495 L 40,-103.923 L 40.1,-103.865 L 50.1,-109.639 L 39.9,-115.528 L 29.9,-109.754 L 30,-109.697 L 20,-103.923 L 19.9,-103.981 L 19.9,-92.4338 L 20,-92.376 L 20,-46.188 L 19.9,-46.2458 L 19.9,-46.0148 z M 10.1,-28.8098 L 10,-28.8675 L 10,-40.4145 L 10.1,-40.3568 L 10.1,-40.4723 L 0,-46.3035 L 0,-34.5255 L 10.1,-28.6943 z M 30.1,-28.8098 L 30.1,-28.9252 L 30,-28.8675 L 30,-40.4145 L 30.1,-40.4722 L 30.1,-40.5877 L 19.9,-34.6987 L 20,-34.641 L 20,-23.094 L 19.9,-23.1517 L 19.9,-22.9208 z M 10,-5.7735 L 10,-17.3205 L 10.1,-17.2628 L 10.1,-17.3783 L 0,-23.2095 L 0,-11.4315 L 9.90001,-5.71576 z"/>
<path id="bottom" fill="#bdbcbc" fill-rule="evenodd" d="M 80,-69.282 L 90,-75.0555 L 90,-74.9401 L 90.2,-75.0555 L 80,-80.9445 L 79.9,-80.8868 L 80,-80.829 L 70,-75.0555 L 69.9,-75.1133 L 69.8,-75.0555 L 80,-69.1666 z M 110.1,-63.5663 L 110.1,-74.9978 L 110,-75.0555 L 100,-69.282 L 100,-69.3975 L 99.9,-69.3398 L 99.9,-57.6773 z M 30,-40.299 L 30,-40.4145 L 70,-63.5085 L 70,-63.3931 L 70.2,-63.5085 L 60,-69.3975 L 59.9,-69.3398 L 60,-69.282 L 30,-51.9615 L 30,-52.077 L 20,-46.3035 L 20,-46.188 L 10,-51.9615 L 10,-52.077 L 0,-57.8505 L 0,-46.0725 L 10,-40.299 L 10,-40.4145 L 20,-34.641 L 20,-34.5255 z M 90.1,-52.0193 L 90.1,-63.6817 L 90,-63.624 L 90,-63.5085 L 80,-57.735 L 80,-57.8505 L 79.9,-57.7928 L 79.9,-46.1303 z M 70.1,-40.4722 L 70.1,-52.1347 L 70,-52.077 L 70,-51.9615 L 30,-28.8675 L 30,-28.983 L 20,-23.2095 L 20,-23.094 L 10,-28.8675 L 10,-28.983 L 0,-34.7565 L 0,-22.9785 L 10,-17.205 L 10,-17.3205 L 20,-11.547 z M 10,-5.7735 L 10,-5.88896 L 0,-11.6625 L 0,-0 z"/>
<path id="top" fill="#303237" fill-rule="evenodd" d="M 40.1,-115.412 L 9.90001,-132.848 L 0,-127.133 L 0,-127.017 L 10,-121.244 L 9.90001,-121.186 L 10,-121.128 L 20,-126.902 L 29.8,-121.244 L 19.8,-115.47 L 19.9,-115.412 L 20,-115.47 L 30,-109.697 L 29.9,-109.639 L 30,-109.581 z M 20.1,-103.981 L 20,-103.923 L 10,-109.697 L 10.1,-109.754 L 9.89999,-109.87 L 9.89999,-98.0918 L 10,-98.0341 L 10,-98.1495 L 20,-92.376 L 20,-92.2606 L 20.1,-92.2028 z M 100.1,-57.7928 L 100.1,-69.3398 L 100,-69.282 L 100,-80.829 L 49.9,-109.754 L 39.8,-103.923 L 39.9,-103.865 L 40,-103.923 L 80,-80.829 L 79.9,-80.7713 L 89.9,-74.9978 L 90,-75.0555 L 90,-63.5085 L 89.9,-63.4508 L 89.9,-51.9038 z M 80.1,-46.2458 L 80.1,-57.7928 L 80,-57.735 L 80,-69.282 L 80.1,-69.3398 L 70.1,-75.1133 L 70,-75.0555 L 30,-98.1495 L 30.1,-98.2073 L 29.9,-98.3227 L 29.9,-86.5448 L 30,-86.487 L 30,-86.6025 L 60,-69.282 L 59.9,-69.2243 L 69.9,-63.4508 L 70,-63.5085 L 70,-51.9615 L 69.9,-51.9038 L 69.9,-40.3568 z M 120,-69.282 L 110,-75.0555 L 109.9,-74.9978 L 109.9,-63.4508 z"/>
</svg>
<script>
// Knobs (URL params), e.g. index.html?n=150&scale=0.5
const q = new URLSearchParams(location.search);
const N = +q.get('n') || 220;          // flame particles; lower if the Pi stutters
const SCALE = +q.get('scale') || 1;    // render resolution; 0.5 = quarter pixels, much faster

const els = ['left', 'bottom', 'top'].map(id => document.getElementById(id));
const faces = els.map(e => new Path2D(e.getAttribute('d')));
const BRAND = els.map(e => e.getAttribute('fill'));
const FACE_SHADE = [1, 1.3, 0.55];     // keep the logo's 3D look: left mid, bottom light, top dark
const LW = 120, LH = 138.564;

// heat 0 (dark red) .. 1 (white-yellow)
const STOPS = [[0, 70, 5, 0], [0.3, 190, 35, 0], [0.6, 255, 110, 5], [0.85, 255, 200, 60], [1, 255, 250, 215]];
function fireColor(t) {
  let i = 1; while (i < STOPS.length - 1 && t > STOPS[i][0]) i++;
  const [a, b] = [STOPS[i - 1], STOPS[i]], k = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])));
  return [1, 2, 3].map(j => a[j] + (b[j] - a[j]) * k);
}
const rgb = (c, m = 1) => `rgb(${c.map(v => Math.min(255, v * m) | 0)})`;
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };

// Logo sprite: logo of `size` px centred in a canvas of size * 1.8 (room for the glow)
function makeSprite(colors, glow, size = 64) {
  const pad = size * 0.4, [cv, g] = canvas(size + pad * 2, size + pad * 2);
  g.translate(pad + (size - size * LW / LH) / 2, pad);
  g.scale(size / LH, size / LH);
  g.translate(0, LH);
  if (glow) { g.shadowColor = glow; g.shadowBlur = size * 0.25; }
  faces.forEach((p, i) => { g.fillStyle = colors[i]; g.fill(p, 'evenodd'); });
  return cv;
}
const LEVELS = 24;
const flame = Array.from({ length: LEVELS }, (_, i) => {
  const c = fireColor(i / (LEVELS - 1));
  return makeSprite(FACE_SHADE.map(m => rgb(c, m)), rgb(c));
});
const brandLogo = makeSprite(BRAND, null, 128);

function glowSprite(color) {
  const [c, g] = canvas(64, 64), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.15, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return c;
}
const BULBS = ['#ff3030', '#30ff60', '#ffcc30', '#3080ff'].map(glowSprite);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, cx, baseY, baseW, rise, open, scene, logs, logsLit, lights, roomGlow, fireGlow;

function drawStocking(g, x, y, s) {
  const w = s * 0.38;
  g.save(); g.translate(x, y);
  g.fillStyle = '#a3101c';
  g.beginPath(); g.moveTo(-w / 2, 0); g.lineTo(w / 2, 0); g.lineTo(w / 2, s * 0.68);
  g.quadraticCurveTo(w * 1.4, s * 0.7, w * 1.35, s * 0.88);
  g.quadraticCurveTo(w * 1.3, s * 1.02, w * 0.1, s);
  g.quadraticCurveTo(-w * 0.6, s * 0.98, -w / 2, s * 0.75);
  g.closePath(); g.fill();
  g.fillStyle = '#efeae0';
  g.beginPath(); g.roundRect(-w * 0.58, 0, w * 1.16, s * 0.24, w * 0.08); g.fill();
  const k = s * 0.17 * 1.8;
  g.drawImage(brandLogo, -k / 2, s * 0.12 - k / 2, k, k);
  g.restore();
}

function drawLog(g, x, y, len, th, rot, flip) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(flip, 1);
  const gr = g.createLinearGradient(0, -th / 2, 0, th / 2);
  gr.addColorStop(0, '#4a2e1c'); gr.addColorStop(0.5, '#2a180d'); gr.addColorStop(1, '#100804');
  g.fillStyle = gr; g.beginPath(); g.roundRect(-len / 2, -th / 2, len, th, th * 0.3); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = th * 0.05; g.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const yy = (Math.random() - 0.5) * th * 0.75;
    g.beginPath(); g.moveTo(-len / 2 + th * 0.3 + Math.random() * len * 0.2, yy);
    g.lineTo(len / 2 - th * 0.6 - Math.random() * len * 0.2, yy + (Math.random() - 0.5) * th * 0.15); g.stroke();
  }
  const ex = len / 2 - th * 0.15;
  g.fillStyle = '#8a6a48'; g.beginPath(); g.ellipse(ex, 0, th * 0.22, th * 0.48, 0, 0, 7); g.fill();
  g.strokeStyle = '#5e4430'; g.lineWidth = th * 0.04;
  for (const r of [0.33, 0.18]) { g.beginPath(); g.ellipse(ex, 0, th * 0.22 * r / 0.48, th * r, 0, 0, 7); g.stroke(); }
  g.restore();
}

function resize() {
  W = cv.width = innerWidth * SCALE; H = cv.height = innerHeight * SCALE;
  cx = W / 2;
  const sw = Math.min(W * 0.92, H * 1.15), ow = sw * 0.62, top = H * 0.47, bot = H * 0.86, fy = H * 0.9;
  open = new Path2D(); open.roundRect(cx - ow / 2, top, ow, bot - top, [ow * 0.2, ow * 0.2, 0, 0]);
  baseY = bot - H * 0.05; baseW = ow * 0.22; rise = bot - top;

  let g; [scene, g] = canvas(W, H);
  // wall with subtle stripes, wooden floor
  g.fillStyle = '#0d1c15'; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,0.025)';
  for (let x = 0; x < W; x += H * 0.06) g.fillRect(x, 0, H * 0.03, fy);
  g.fillStyle = '#1a0f08'; g.fillRect(0, fy, W, H - fy);
  // brick surround
  const x0 = cx - sw / 2, y0 = H * 0.25, bh = H * 0.032, bw = bh * 2.4, m = Math.max(1, bh * 0.1);
  g.fillStyle = '#24130f'; g.fillRect(x0, y0, sw, fy - y0);
  g.save(); g.beginPath(); g.rect(x0, y0, sw, fy - y0); g.clip();
  for (let row = 0, y = y0; y < fy; row++, y += bh)
    for (let x = x0 - (row % 2) * bw / 2; x < x0 + sw; x += bw) {
      g.fillStyle = rgb([115, 38, 26], 0.7 + Math.random() * 0.4);
      g.fillRect(x + m / 2, y + m / 2, bw - m, bh - m);
    }
  g.restore();
  // firebox: sooty inside
  const soot = g.createLinearGradient(0, top, 0, bot);
  soot.addColorStop(0, '#000'); soot.addColorStop(1, '#150904');
  g.fillStyle = soot; g.fill(open);
  // hearth stone
  g.fillStyle = '#34302d'; g.fillRect(cx - sw * 0.56, bot, sw * 1.12, fy - bot + H * 0.01);
  g.fillStyle = '#4a4542'; g.fillRect(cx - sw * 0.56, bot, sw * 1.12, H * 0.006);
  // mantel
  const my = H * 0.22, mh = H * 0.04, mw = sw * 1.14;
  const wood = g.createLinearGradient(0, my, 0, my + mh);
  wood.addColorStop(0, '#6a3f25'); wood.addColorStop(1, '#2e170c');
  g.fillStyle = wood; g.fillRect(cx - mw / 2, my, mw, mh);
  g.fillStyle = '#80502f'; g.fillRect(cx - mw / 2, my, mw, mh * 0.18);
  // stockings, then the garland draped over their hooks
  const st = H * 0.15, sy = my + mh + H * 0.035;
  g.strokeStyle = '#d8d0c0'; g.lineWidth = Math.max(1, H * 0.002);
  for (const f of [-0.33, 0, 0.33]) {
    g.beginPath(); g.moveTo(cx + f * sw, my + mh); g.lineTo(cx + f * sw, sy); g.stroke();
    drawStocking(g, cx + f * sw, sy, st);
  }
  lights = [];
  for (let i = 0; i <= 400; i++) {
    const u = i / 400, x = cx - mw / 2 + u * mw;
    const y = my + mh * 0.6 + Math.sin((u * 4 % 1) * Math.PI) * H * 0.035;
    for (let j = 0; j < 5; j++) {
      const a = Math.random() * 6.28, r = Math.random() * H * 0.02;
      g.strokeStyle = rgb([20, 70 + Math.random() * 50, 30]); g.lineWidth = Math.max(1, H * 0.003);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.stroke();
    }
    if (i % 40 === 20) { g.fillStyle = '#c0141e'; g.beginPath(); g.arc(x, y, H * 0.006, 0, 7); g.fill(); }
    if (i % 14 === 7) lights.push({ x, y: y + H * 0.008, c: BULBS[lights.length % BULBS.length], ph: Math.random() * 6.28, sp: 1 + Math.random() * 2 });
  }

  // logs + a fire-lit copy we fade in and out
  [logs, g] = canvas(W, H);
  const th = H * 0.06;
  drawLog(g, cx - ow * 0.09, baseY - th * 0.1, ow * 0.5, th, -0.13, 1);
  drawLog(g, cx + ow * 0.09, baseY - th * 0.1, ow * 0.5, th, 0.13, -1);
  drawLog(g, cx, bot - th * 0.6, ow * 0.62, th * 1.15, 0.02, 1);
  [logsLit, g] = canvas(W, H);
  g.drawImage(logs, 0, 0); g.globalCompositeOperation = 'source-atop';
  const lit = g.createLinearGradient(0, baseY - th, 0, bot);
  lit.addColorStop(0, 'rgba(255,120,20,0.7)'); lit.addColorStop(1, 'rgba(255,60,0,0.2)');
  g.fillStyle = lit; g.fillRect(0, 0, W, H);

  roomGlow = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, H * 0.9);
  roomGlow.addColorStop(0, 'rgba(255,120,30,0.35)'); roomGlow.addColorStop(1, 'rgba(0,0,0,0)');
  fireGlow = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, ow * 0.6);
  fireGlow.addColorStop(0, 'rgba(255,120,20,0.8)'); fireGlow.addColorStop(0.5, 'rgba(160,40,0,0.3)'); fireGlow.addColorStop(1, 'rgba(0,0,0,0)');
}
addEventListener('resize', resize); resize();

const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function spawn(p = {}) {
  const spark = Math.random() < 0.03;
  p.spark = spark;
  p.x = cx + gauss() * baseW;
  p.y = baseY + Math.random() * rise * 0.05;
  p.vx = gauss() * baseW * 0.2;
  p.vy = -rise * (spark ? 1.1 + Math.random() * 0.5 : 0.5 + Math.random() * 0.45);
  p.life = spark ? 1 + Math.random() : 0.8 + Math.random() * 1.1;
  p.age = 0;
  p.size = baseW * (spark ? 0.08 : 0.4 + Math.random() * 0.4);
  p.rot = gauss() * 0.4; p.spin = gauss() * 1.5;
  p.phase = Math.random() * 6.28;
  return p;
}
const parts = Array.from({ length: N }, () => { const p = spawn(); p.age = Math.random() * p.life; return p; });

let t = 0;
function step(p, dt) {
  p.age += dt;
  if (p.age >= p.life) spawn(p);
  // turbulence + pull toward the centre so the flame tapers into a tip
  p.vx += Math.sin(t * 3 + p.phase + p.y * 0.01 / SCALE) * baseW * (p.spark ? 5 : 2) * dt;
  if (!p.spark) p.x += (cx - p.x) * 1.2 * dt;
  p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
}
// warm up so the fire is already burning on the first frame
for (let i = 0; i < 120; i++) { t += 1 / 30; parts.forEach(p => step(p, 1 / 30)); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const flick = 0.75 + 0.15 * Math.sin(t * 7.3) + 0.1 * Math.sin(t * 13.1 + 1);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(scene, 0, 0);

  ctx.save(); ctx.clip(open);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = flick; ctx.fillStyle = fireGlow; ctx.fillRect(0, 0, W, H);
  for (const p of parts) {
    step(p, dt);
    const a = p.age / p.life;
    const centre = 1 - Math.min(1, Math.abs(p.x - cx) / (baseW * 1.8));
    const heat = p.spark ? 1 - a * 0.6 : Math.max(0, (1 - a) * (0.5 + 0.4 * centre));
    const size = p.size * (p.spark ? 1 : 1 - 0.65 * a * a);
    const k = size * 1.8;
    ctx.globalAlpha = Math.min(1, a * 8) * (1 - a) * (p.spark ? 1 : 0.45);
    ctx.setTransform(1, 0, 0, 1, p.x, p.y); ctx.rotate(p.rot);
    ctx.drawImage(flame[Math.round(heat * (LEVELS - 1))], -k / 2, -k / 2, k, k);
  }
  ctx.restore();

  ctx.drawImage(logs, 0, 0);
  ctx.globalAlpha = flick * 0.6; ctx.drawImage(logsLit, 0, 0);

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = flick * 0.6; ctx.fillStyle = roomGlow; ctx.fillRect(0, 0, W, H);
  const b = H * 0.035;
  for (const l of lights) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * l.sp + l.ph);
    ctx.drawImage(l.c, l.x - b / 2, l.y - b / 2, b, b);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
