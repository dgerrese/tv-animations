<script>
// th[is] logos snowing down in three layers, each flake with its left leg in one of
// 12 hues. Port of the KDE wallpaper local.thissnow.
// Knobs (URL params), e.g. index.html?amount=120&speed=3&size=4
const q = new URLSearchParams(location.search);
const SCALE = +q.get('scale') || 1;   // render resolution; 0.5 = a quarter of the pixels, much lighter
const AMOUNT = +q.get('amount') || 80;   // flakes on screen
const SPEED = +q.get('speed') || 5;      // x20 px/s at 1080p for the nearest layer
const SIZE = +q.get('size') || 5;        // nearest flake, % of screen width

// one 256 px sprite per hue: the logo with its left leg in hue i, centred in a square
const LH = 138.564, faces = ['left', 'bottom', 'top'].map(id => new Path2D(document.getElementById(id).getAttribute('d')));
const sprites = Array.from({ length: 12 }, (_, i) => {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = c.height = 256;
  g.scale(256 / LH, 256 / LH);
  g.translate((LH - 120) / 2, LH);
  // the logo's top colour #303237 is lifted to read on dark
  [`hsl(${29 + 30 * i} 92% 52%)`, '#bdbcbc', '#6b6e75'].forEach((col, k) => { g.fillStyle = col; g.fill(faces[k], 'evenodd'); });
  return c;
});

// far to near: smaller, slower and dimmer the further away
const LAYERS = [
  { scale: 0.35, pace: 0.4, share: 0.5, alpha: 0.45 },
  { scale: 0.6, pace: 0.65, share: 0.3, alpha: 0.75 },
  { scale: 1.0, pace: 1.0, share: 0.2, alpha: 1.0 },
];
const rand = (a, b) => a + Math.random() * (b - a);
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, k;

function flake(L, y) {
  const s = Math.max(W * SIZE / 100 * L.scale, 4) * rand(0.8, 1.2), fall = SPEED * 20 * L.pace * k;
  return { x: rand(-s, W + s), y: y ?? -s, s, vy: fall * rand(0.8, 1.2), sway: 0, rot: rand(0, 360),
    spin: rand(-25, 25), sprite: sprites[Math.floor(Math.random() * 12)] };
}
// start with the screen already full
function fill() {
  LAYERS.forEach(L => { L.flakes = Array.from({ length: Math.round(AMOUNT * L.share) }, () => flake(L, rand(-0.1, 1) * H)); });
}
function resize() {
  W = cv.width = Math.round(innerWidth * devicePixelRatio * SCALE);
  H = cv.height = Math.round(innerHeight * devicePixelRatio * SCALE);
  k = H / 1080;
  fill();
}
addEventListener('resize', resize);
resize();

let prev = null;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = prev === null ? 0 : Math.min((now - prev) / 1000, 0.1);
  prev = now;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  for (const L of LAYERS) {
    g.globalAlpha = L.alpha;
    L.flakes.forEach((f, i) => {
      // sideways sway while falling
      f.sway = Math.max(-40 * k, Math.min(40 * k, f.sway + rand(-200, 200) * k * dt));
      f.x += f.sway * dt; f.y += f.vy * dt; f.rot += f.spin * dt;
      if (f.y - f.s > H) f = L.flakes[i] = flake(L);
      g.save();
      g.translate(f.x, f.y);
      g.rotate(f.rot * Math.PI / 180);
      g.drawImage(f.sprite, -f.s / 2, -f.s / 2, f.s, f.s);
      g.restore();
    });
  }
  g.globalAlpha = 1;
}
requestAnimationFrame(frame);
</script>
