<style>

<body>
<canvas id="c"></canvas>
<!-- the logo's legs as a mask: left = red, bottom = green, top = blue, with a 12-unit transparent pad -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -150.564 144 162.564" width="144" height="162.564">

</svg>
<script>
// The th[is] logo tiled on a triangle grid; straight wave fronts sweep across the screen and
// turn each tile they pass by 120° (shrinking it so it stays in its cell), and the colours turn with it.
// Port of the KDE wallpaper local.thisripple.
// Knobs (URL params), e.g. index.html?speed=5&interval=6&rows=8
const q = new URLSearchParams(location.search);
const SCALE = +q.get('scale') || 1;   // render resolution; 0.5 = a quarter of the pixels, much lighter
const num = (name, def) => q.has(name) ? +q.get(name) : def;
const SPEED = Math.max(num('speed', 5), 0.1);       // the front moves speed/15 screen widths per second
const INTERVAL = Math.max(num('interval', 6), 0.5); // seconds between sweeps
const ROWS = Math.max(Math.round(num('rows', 8)), 1);  // tiles stacked top to bottom
const LEFT = '#' + (q.get('colour') || 'f58113');

// sweep timing, as ripple.js in the wallpaper
const TURN = 1.2, MAX_SWEEPS = 8;
// A sweep front travelling along `angle`; offset and extent span the screen corners, widened by
// `margin` (the tile side) so partly visible edge tiles are covered too.
function newSweep(angle, aspect, start, margin) {
  const dx = Math.cos(angle), dy = Math.sin(angle), p = [0, dx * aspect, dy, dx * aspect + dy];
  const lo = Math.min(...p), hi = Math.max(...p);
  return { dx, dy, offset: lo - margin, extent: hi - lo + 2 * margin, start };
}
// drop finished sweeps (folding their turn into base), then start a new one when due and a slot is free
function step(state, t, v, aspect, margin) {
  state.sweeps = state.sweeps.filter(s => {
    if (t > s.start + s.extent / v + TURN) { state.base = (state.base + 1) % 3; return false; }
    return true;
  });
  if (t >= state.next && state.sweeps.length < MAX_SWEEPS) {
    state.sweeps.push(newSweep(2 * Math.PI * Math.random(), aspect, t, margin));
    state.next = t + INTERVAL;
  }
}

const frag = `#version 300 es
precision highp float;
in highp vec2 qt_TexCoord0;
out vec4 fragColor;
uniform highp float aspect;
uniform highp int rows;
uniform highp float v;
uniform highp float base;
uniform highp vec4 s[${MAX_SWEEPS}];   // (dx, dy, offset, age); unused ones have age -1000
uniform highp float pixels;
uniform sampler2D mask;
uniform lowp vec4 colourLeft;
uniform lowp vec4 colourBottom;
uniform lowp vec4 colourTop;
uniform lowp vec4 background;

const highp float PI = 3.14159265;
const highp float THIRD = 2.0943951;   // 2pi/3
const highp float TURN = ${TURN.toFixed(3)};

highp float ease(highp float u) {
    u = clamp(u, 0.0, 1.0);
    return u * u * (3.0 - 2.0 * u);
}

// rotate(-a), the screen-to-logo turn (screen y and SVG y both point down)
highp vec2 logo(highp vec2 d, highp float ca, highp float sa) {
    return vec2(ca * d.x + sa * d.y, -sa * d.x + ca * d.y);
}

// scale that keeps a tile turned by a inside its own cell: 1 at multiples of 120°, 0.5 at 60° off
highp float fitScale(highp float a) {
    highp float d = abs(a - floor(a / THIRD + 0.5) * THIRD);
    return 1.0 / (cos(d) + sqrt(3.0) * sin(d));
}

void main() {
    highp vec2 p = vec2(qt_TexCoord0.x * aspect, qt_TexCoord0.y);

    // grid: tile side from the height, a column boundary on the centre line
    highp float side = 1.0 / float(rows), col = side * sqrt(3.0) / 2.0;
    highp float x0 = aspect / 2.0 - floor(aspect / 2.0 / col) * col;

    // the tile containing p: centroid c, flip 1 = left-pointing
    highp float u = (p.x - x0) / col, i = floor(u), fx = u - i;
    highp float o = mod(i, 2.0) > 0.5 ? side / 2.0 : 0.0;
    highp float w = (p.y - o) / side, j = floor(w), fy = w - j;
    highp vec2 c;
    highp float flip;
    if (abs(fy - 0.5) <= 0.5 * (1.0 - fx)) {
        c = vec2(x0 + (i + 1.0 / 3.0) * col, o + (j + 0.5) * side);
        flip = 0.0;
    } else {
        c = vec2(x0 + (i + 2.0 / 3.0) * col, o + (fy < 0.5 ? j : j + 1.0) * side);
        flip = 1.0;
    }

    // a tile turns once as each front passes its centroid
    highp float t = base;
    for (int k = 0; k < ${MAX_SWEEPS}; k++)
        t += ease((s[k].w - (dot(s[k].xy, c) - s[k].z) / v) / TURN);
    highp float a = flip * PI + t * THIRD;
    highp float k = fitScale(t * THIRD);

    // into logo space (centroid (40, -69.282), side 138.564), then mask texture space
    // (viewBox -12 -150.564 144 162.564)
    highp float ca = cos(a), sa = sin(a);
    // grow each tile so its edges move out by 1 px, covering the mask's antialiased edge
    highp float grow = max(1.0 - 3.4641 / (k * side * pixels), 0.5);
    highp vec2 scale = grow / (k * side) * 138.564 / vec2(144.0, 162.564);
    highp vec2 uv = (logo(p - c, ca, sa) * 138.564 * grow / (k * side) + vec2(40.0, -69.282)
                     - vec2(-12.0, -150.564)) / vec2(144.0, 162.564);
    // uv jumps between cells, so take the derivatives from the continuous p (no dark dots on cell edges)
    lowp vec4 m = textureGrad(mask, uv, logo(dFdx(p), ca, sa) * scale, logo(dFdy(p), ca, sa) * scale);

    lowp vec4 col4 = background;
    col4 = mix(col4, colourLeft, m.r);
    col4 = mix(col4, colourBottom, m.g);
    col4 = mix(col4, colourTop, m.b);
    fragColor = vec4(col4.rgb, 1.0);
}`;

const cv = document.getElementById('c'), gl = cv.getContext('webgl2');
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
// the same qt_TexCoord0 as Qt's ShaderEffect: (0,0) top-left
gl.attachShader(prog, shader(gl.VERTEX_SHADER, '#version 300 es\nin vec2 v; out highp vec2 qt_TexCoord0;' +
  'void main() { qt_TexCoord0 = vec2(v.x * 0.5 + 0.5, 0.5 - v.y * 0.5); gl_Position = vec4(v, 0.0, 1.0); }'));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, frag));
gl.bindAttribLocation(prog, 0, 'v');
gl.linkProgram(prog);
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const u = name => gl.getUniformLocation(prog, name);
const rgba = hex => [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255).concat([1]);
gl.uniform1i(u('rows'), ROWS);
gl.uniform1i(u('mask'), 0);
gl.uniform4fv(u('colourLeft'), rgba(LEFT));
gl.uniform4fv(u('colourBottom'), rgba('#bdbcbc'));
gl.uniform4fv(u('colourTop'), rgba('#6b6e75'));
gl.uniform4fv(u('background'), rgba('#000000'));

// the mask, drawn at twice the tile height and mipmapped. Premultiplied, as Qt uploads it, so
// a channel's value is that leg's coverage and the edges stay antialiased
const svg = new Image(), tex = gl.createTexture();
svg.src = 'data:image/svg+xml,' + encodeURIComponent(new XMLSerializer().serializeToString(document.querySelector('svg')));
function drawMask() {
  if (!svg.complete || !cv.height) return;
  const h = Math.max(64, Math.round(cv.height / ROWS)) * 2, c = document.createElement('canvas');
  c.height = h; c.width = Math.round(h * 144 / 162.564);
  c.getContext('2d').drawImage(svg, 0, 0, c.width, c.height);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
svg.onload = drawMask;

let aspect = 1, v = 1;
function resize() {
  cv.width = Math.round(innerWidth * devicePixelRatio * SCALE);
  cv.height = Math.round(innerHeight * devicePixelRatio * SCALE);
  gl.viewport(0, 0, cv.width, cv.height);
  aspect = cv.width / cv.height;
  v = SPEED / 15 * aspect;   // screen heights per second
  gl.uniform1f(u('aspect'), aspect);
  gl.uniform1f(u('pixels'), cv.height);
  gl.uniform1f(u('v'), v);
  drawMask();
}
addEventListener('resize', resize);
resize();

const state = { sweeps: [], base: 0, next: 0 }, sw = new Float32Array(4 * MAX_SWEEPS);
function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000;
  step(state, t, v, aspect, 1 / ROWS);
  for (let k = 0; k < MAX_SWEEPS; k++) {
    const s = state.sweeps[k];
    sw.set(s ? [s.dx, s.dy, s.offset, t - s.start] : [1, 0, 0, -1000], 4 * k);
  }
  gl.uniform1f(u('base'), state.base);
  gl.uniform4fv(u('s'), sw);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);
</script>
